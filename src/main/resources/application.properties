spring.application.name=StradeX

# MySQL connection - set MYSQL_PASSWORD (or replace the default after the colon)
spring.datasource.url=jdbc:mysql://localhost:3306/stradex_db?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:YOUR_MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.port=8080
server.servlet.session.tracking-modes=cookie
